name: MLOps CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (syntax and undefined-name checks)
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Download dataset
        run: python scripts/download_data.py
      - name: Generate EDA
        run: python scripts/eda.py
      - name: Train models and log experiments
        run: python scripts/train.py
      - name: Upload evidence and model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-run-artifacts
          path: |
            artifacts/
            reports/figures/
            mlflow.db
          if-no-files-found: warn
