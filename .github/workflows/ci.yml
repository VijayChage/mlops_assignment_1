name: MLOps CI

on:
  push:
    branches:
      - feature/cicd-changes
  pull_request:
  workflow_dispatch:

jobs:
  validate-train:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MLOps_Heart_Disease_Assignment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: MLOps_Heart_Disease_Assignment/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Diagnose MLflow and SQLAlchemy versions
        run: |
          python -m pip show mlflow sqlalchemy
          python -c "import sqlalchemy; print('SQLAlchemy:', sqlalchemy.__version__); print('Module:', sqlalchemy.__file__)"
          python -c "from sqlalchemy.pool import FallbackAsyncAdaptedQueuePool; print('FallbackAsyncAdaptedQueuePool: available')"
          
      - name: Lint
        run: ruff check .

      - name: Download UCI dataset
        run: python scripts/download_data.py

      - name: Validate and preprocess dataset
        run: python scripts/preprocess.py

      - name: Generate EDA
        run: python scripts/eda.py

      - name: Train models and track experiments
        run: python scripts/train.py

      - name: Run unit tests
        run: python -m pytest -v

      - name: Upload evidence and model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-run-artifacts
          path: |
            MLOps_Heart_Disease_Assignment/artifacts/
            MLOps_Heart_Disease_Assignment/data/processed/
            MLOps_Heart_Disease_Assignment/reports/figures/
            MLOps_Heart_Disease_Assignment/mlflow.db
          if-no-files-found: warn
